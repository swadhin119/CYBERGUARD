services:
  - type: web
    name: cyberguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: false
      - key: RELOAD
        value: false
      - key: CORS_ORIGINS
        value: https://YOUR-SITE.netlify.app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./cyberguard.db
